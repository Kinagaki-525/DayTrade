source_matrix_schema_version: 3
market_research_version: "market-research-v2"
default_research_cutoff_time: "20:00:00+09:00"
tdnet_bootstrap_lookback_days: 1
default_discovery_market_filter: ALL_MARKETS
source_change_policy:
  managed_as_research_method_change: true
  runtime_substitution_allowed: false

sources:
  - source_id: JPX_CALENDAR
    information_type: TRADING_CALENDAR
    role: PRIMARY
    criticality: TRADE_CRITICAL
    source_name: JPX Calendar
    url_template: "https://www.jpx.co.jp/corporate/about-jpx/calendar/"
    update_timing: JPX_PUBLICATION
    zero_results_are_found: false
    acquisition:
      mode: DETERMINISTIC
      transport: CURL_GET
      network_scope: MATRIX_TEMPLATE_HOST
      parser_id: jpx.calendar
      stage: STAGE1

  - source_id: JPX_LISTED_COMPANY
    information_type: LISTED_COMPANY
    role: PRIMARY
    criticality: TRADE_CRITICAL
    source_name: JPX TSE Listed Company Information Stock Search
    url_template: "https://www2.jpx.co.jp/tseHpFront/StockSearch.do?method=topsearch&topSearchStr={ticker}"
    update_timing: JPX_PUBLICATION
    zero_results_are_found: false
    notes: >
      Candidate-specific TSE listing evidence. The parser matches the JPX
      displayed code as candidate_code + "0" exactly -- no substring, prefix
      or numeric conversion -- and publishes the market segment verbatim.
      Listing confirmation is deliberately separate from Strategy
      eligibility: an ETF that is listed is FOUND here and is rejected later
      by the Stage 1 security_type check, never by a listing NOT_FOUND.
    acquisition:
      mode: DETERMINISTIC
      transport: CURL_GET
      network_scope: MATRIX_TEMPLATE_HOST
      parser_id: jpx.stock_search
      stage: STAGE1

  - source_id: JPX_FOREIGN_STOCK_LIST
    information_type: TRADING_UNIT
    role: PRIMARY
    criticality: TRADE_CRITICAL
    source_name: JPX Foreign Stocks Listed Issues
    url_template: "https://www.jpx.co.jp/equities/products/foreign/issues/index.html"
    update_timing: JPX_PUBLICATION
    zero_results_are_found: false
    notes: >
      Global Source: one GET, one Global Attempt, one Source Value with
      ticker=null. Publishes the foreign listed issues and their per-issue
      trading units. Used as the evidence that separates foreign stocks from
      domestic common stocks inside the Prime/Standard/Growth segments; a
      table whose header cannot be recognized is PARSE_FAILED, so a partial
      page is never read as a complete foreign-stock list.
    acquisition:
      mode: DETERMINISTIC
      transport: CURL_GET
      network_scope: MATRIX_TEMPLATE_HOST
      parser_id: jpx.foreign_stock_list
      stage: STAGE1

  - source_id: JPX_TRADING_UNIT
    information_type: TRADING_UNIT
    role: PRIMARY
    criticality: TRADE_CRITICAL
    source_name: JPX Domestic Stock Trading Unit Rule
    url_template: "https://www.jpx.co.jp/equities/trading/domestic/03.html"
    update_timing: JPX_PUBLICATION
    zero_results_are_found: false
    notes: >
      Global Source: the market-wide trading-unit rule for domestic stocks,
      not a per-candidate trading-unit page. Its value is applied as
      share_unit only to candidates whose security_type is
      DOMESTIC_COMMON_STOCK; ETFs, foreign stocks and unclassified
      candidates never receive it.
    acquisition:
      mode: DETERMINISTIC
      transport: CURL_GET
      network_scope: MATRIX_TEMPLATE_HOST
      parser_id: jpx.domestic_trading_unit_rule
      stage: STAGE1

  - source_id: JPX_LISTED_COMPANY_AUDIT
    information_type: LISTED_COMPANY
    role: AUDIT
    criticality: CONTEXT
    source_name: JPX Listed Issues List
    url_template: "https://www.jpx.co.jp/markets/statistics-equities/misc/01.html"
    update_timing: JPX_PUBLICATION
    zero_results_are_found: false
    acquisition:
      mode: DETERMINISTIC
      transport: CURL_GET
      network_scope: MATRIX_TEMPLATE_HOST
      parser_id: jpx.listed_company
      stage: STAGE1

  - source_id: YAHOO_JP_VOLUME_RANKING
    information_type: VOLUME_RANKING
    role: PRIMARY
    criticality: DISCOVERY_CRITICAL
    source_name: Yahoo! Finance Japan Stock Ranking - Volume
    url_template: "https://finance.yahoo.co.jp/stocks/ranking/volume?market=all"
    update_timing: MARKET_CLOSE_AFTER_UPDATE
    zero_results_are_found: false
    acquisition:
      mode: DETERMINISTIC
      transport: CURL_GET
      network_scope: MATRIX_TEMPLATE_HOST
      parser_id: yahoo_jp.ranking
      stage: DISCOVERY

  - source_id: YAHOO_JP_GAIN_RANKING
    information_type: PRICE_GAIN_RANKING
    role: PRIMARY
    criticality: DISCOVERY_CRITICAL
    source_name: Yahoo! Finance Japan Stock Ranking - Price Gain
    url_template: "https://finance.yahoo.co.jp/stocks/ranking/up?market=all"
    update_timing: MARKET_CLOSE_AFTER_UPDATE
    zero_results_are_found: false
